# Liquid Glass — thème Rockbox pour iPod nano 3G (320x240)
# Copier le dossier .rockbox à la racine de l'iPod, puis :
# Réglages > Réglages thème > Liste des thèmes > LiquidGlass
# (Settings > Theme Settings > Browse Theme Files, en anglais)
wps: /.rockbox/wps/LiquidGlass.wps
sbs: /.rockbox/wps/LiquidGlass.sbs
fms: -
backdrop: /.rockbox/backdrops/LiquidGlass.bmp
font: /.rockbox/fonts/16-Inter-Medium.fnt
iconset: /.rockbox/icons/LiquidGlass.bmp
viewers iconset: -
foreground color: F2F4FA
background color: 0B1020
selector type: bar (color)
line selector start color: 0886FF
line selector end color: 0886FF
line selector text color: FFFFFF
statusbar: top
scrollbar: off
show icons: on
list separator height: 0
ui viewport: -
