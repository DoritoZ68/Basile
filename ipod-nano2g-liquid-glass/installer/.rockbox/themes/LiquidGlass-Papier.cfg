# Liquid Glass — thème Rockbox pour iPod nano 2G (176x132)
# Fond « Papier » : fond iOS 27 fourni (vagues de papier)
# Copier le dossier .rockbox à la racine de l'iPod, puis :
# Réglages > Réglages thème > Liste des thèmes > LiquidGlass-Papier
# (Settings > Theme Settings > Browse Theme Files, en anglais)
wps: /.rockbox/wps/LiquidGlass-Papier.wps
sbs: /.rockbox/wps/LiquidGlass-Papier.sbs
fms: -
backdrop: /.rockbox/backdrops/LiquidGlass-Papier.bmp
font: /.rockbox/fonts/12-Inter-Medium.fnt
iconset: /.rockbox/icons/LiquidGlass.bmp
viewers iconset: -
foreground color: F2F4FA
background color: 0B1020
selector type: bar (color)
line selector start color: 0886FF
line selector end color: 0886FF
line selector text color: FFFFFF
statusbar: top
scrollbar: off
show icons: on
list separator height: 0
ui viewport: -
# Raccourcis (dont Cover Flow) en tête du menu principal
root menu order: shortcuts, files, database, wps, settings, recording, playlists, plugins, system_menu
